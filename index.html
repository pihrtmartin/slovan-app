<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC Slovan Louny - Statistiky a Sestavy</title>

    <!-- PWA Ikona a Manifest pro Android/iOS -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002D62">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas pro export sestavy jako obrázek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .bg-slovan-blue { background-color: #002D62; }
        .text-slovan-blue { color: #002D62; }
        .border-slovan-blue { border-color: #002D62; }
        .bg-slovan-red { background-color: #C8102E; }
        .text-slovan-red { color: #C8102E; }
        .hockey-rink {
            background: #f8fafc;
            border: 4px solid #002D62;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- HLAVIČKA -->
    <header class="bg-slovan-blue text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-3 sm:mb-0">
                <div class="bg-white text-slovan-blue font-black p-2 rounded-xl shadow text-xl">SLOVAN</div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider">HC SLOVAN LOUNY</h1>
                    <p class="text-xs text-slate-300">Správa zápasů a sestav</p>
                </div>
            </div>
            <nav class="flex space-x-2">
                <button onclick="switchTab('matches')" id="btn-matches" class="px-4 py-2 rounded-lg bg-slovan-red text-white font-medium text-sm transition shadow">Zápasy</button>
                <button onclick="switchTab('players')" id="btn-players" class="px-4 py-2 rounded-lg bg-blue-900 text-slate-200 hover:bg-slate-700 font-medium text-sm transition">Hráči</button>
            </nav>
        </div>
    </header>

    <!-- HLAVNÍ OBSAH -->
    <main class="container mx-auto px-4 py-6 max-w-5xl">

        <!-- SEKCE: ZÁPASY -->
        <section id="tab-matches" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-slovan-blue"><i class="fa-solid fa-calendar-days mr-2"></i>Seznam zápasů</h2>
                <button onclick="openNewMatchModal()" class="bg-slovan-red hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow font-medium text-sm transition">
                    <i class="fa-solid fa-plus mr-1"></i> Nový zápas
                </button>
            </div>
            <div id="matches-list" class="grid gap-4 md:grid-cols-2">
                <!-- Vkládáno dynamicky -->
            </div>
        </section>

        <!-- SEKCE: HRÁČI -->
        <section id="tab-players" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-slovan-blue"><i class="fa-solid fa-users mr-2"></i>Kmenoví hráči</h2>
                <button onclick="addPlayerPrompt()" class="bg-slovan-blue hover:bg-blue-900 text-white px-4 py-2 rounded-lg shadow font-medium text-sm transition">
                    <i class="fa-solid fa-user-plus mr-1"></i> Přidat hráče
                </button>
            </div>
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-200 text-slate-700 text-sm">
                            <th class="p-3">#</th>
                            <th class="p-3">Jméno a příjmení</th>
                            <th class="p-3">Post</th>
                            <th class="p-3 text-right">Akce</th>
                        </tr>
                    </thead>
                    <tbody id="players-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Vkládáno dynamicky -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SEKCE: DETAIL ZÁPASU & SESTAVY -->
        <section id="tab-match-detail" class="hidden space-y-6">
            <button onclick="switchTab('matches')" class="text-slovan-blue hover:underline text-sm font-semibold mb-2">
                <i class="fa-solid fa-arrow-left mr-1"></i> Zpět na seznam zápasů
            </button>
            
            <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-slovan-blue flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span id="detail-match-date" class="text-xs font-bold text-slovan-red uppercase tracking-wider"></span>
                    <h2 id="detail-match-title" class="text-3xl font-black text-slovan-blue"></h2>
                    <p id="detail-match-info" class="text-slate-500 text-sm mt-1"></p>
                </div>
                <button onclick="openLineupModal()" class="bg-slovan-red hover:bg-red-700 text-white px-5 py-3 rounded-xl shadow-lg font-bold flex items-center gap-2 transition transform hover:scale-105">
                    <i class="fa-solid fa-chess-board text-lg"></i> Vytvořit sestavu
                </button>
            </div>

            <!-- Náhled uložených sestav -->
            <div class="bg-white p-6 rounded-2xl shadow-md space-y-4">
                <h3 class="text-lg font-bold text-slovan-blue"><i class="fa-solid fa-shield-halved mr-2"></i>Uložené sestavy k zápasu</h3>
                <div id="saved-lineups-preview" class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Vkládáno dynamicky -->
                </div>
            </div>
        </section>

    </main>

    <!-- MODÁLNÍ OKNO: NOVÝ ZÁPAS -->
    <div id="modal-match" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-xl font-bold text-slovan-blue">Přidat nový zápas</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Soupeř</label>
                    <input type="text" id="match-opponent" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slovan-blue outline-none" placeholder="např. HC Rakovník">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Datum a čas</label>
                    <input type="datetime-local" id="match-date" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slovan-blue outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Dostupní hráči pro tento zápas</label>
                    <div id="match-players-checkboxes" class="max-h-40 overflow-y-auto border rounded-lg p-2 space-y-1 text-sm bg-slate-50">
                        <!-- Generováno dynamicky -->
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeNewMatchModal()" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 text-sm font-medium">Zrušit</button>
                <button onclick="saveNewMatch()" class="px-4 py-2 rounded-lg bg-slovan-red text-white text-sm font-medium">Uložit zápas</button>
            </div>
        </div>
    </div>

    <!-- MODÁLNÍ OKNO: LEDOVÁ PLOCHA & SESTAVY -->
    <div id="modal-lineup" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-2 sm:p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-4xl w-full p-4 sm:p-6 shadow-2xl space-y-4 my-auto">
            
            <div class="flex justify-between items-center border-b pb-3">
                <div>
                    <h3 class="text-xl font-black text-slovan-blue"><i class="fa-solid fa-hockey-puck mr-2"></i>Interaktivní sestava</h3>
                    <p class="text-xs text-slate-500">Nacvakejte lajny na hřišti</p>
                </div>
                <button onclick="closeLineupModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Přepínání lajn -->
            <div class="flex flex-wrap gap-2 justify-center bg-slate-100 p-2 rounded-xl" id="lineup-tabs">
                <button onclick="switchLineupTab('lajna1')" id="ltab-lajna1" class="px-4 py-2 rounded-lg font-bold text-sm bg-slovan-blue text-white shadow">1. Lajna</button>
                <button onclick="switchLineupTab('lajna2')" id="ltab-lajna2" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-slate-700 hover:bg-slate-200">2. Lajna</button>
                <button onclick="switchLineupTab('lajna3')" id="ltab-lajna3" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-slate-700 hover:bg-slate-200">3. Lajna</button>
                <button onclick="switchLineupTab('special')" id="ltab-special" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-slate-700 hover:bg-slate-200">Speciální formace</button>
            </div>

            <!-- Oblast hřiště pro export obrázku -->
            <div id="rink-capture-area" class="hockey-rink p-6 h-[480px] flex flex-col justify-between shadow-inner relative">
                <div class="absolute inset-x-0 top-1/2 h-1 bg-red-600 -translate-y-1/2 opacity-30 pointer-events-none"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 border-2 border-blue-900 rounded-full opacity-20 pointer-events-none"></div>

                <!-- ÚTOK (LW, C, RW) -->
                <div class="flex justify-around items-center z-10">
                    <div class="text-center w-1/3 px-2">
                        <label class="block text-[10px] font-black uppercase text-slovan-blue tracking-wider mb-1">Levé křídlo (LW)</label>
                        <select id="pos-LW" onchange="updateLineupData()" class="w-full bg-white/90 border-2 border-slovan-blue rounded-lg p-2 text-xs font-bold text-slate-800 shadow">
                            <option value="">-- Vyberte hráče --</option>
                        </select>
                    </div>
                    <div class="text-center w-1/3 px-2">
                        <label class="block text-[10px] font-black uppercase text-slovan-blue tracking-wider mb-1">Centr (C)</label>
                        <select id="pos-C" onchange="updateLineupData()" class="w-full bg-white/90 border-2 border-slovan-blue rounded-lg p-2 text-xs font-bold text-slate-800 shadow">
                            <option value="">-- Vyberte hráče --</option>
                        </select>
                    </div>
                    <div class="text-center w-1/3 px-2">
                        <label class="block text-[10px] font-black uppercase text-slovan-blue tracking-wider mb-1">Pravé křídlo (RW)</label>
                        <select id="pos-RW" onchange="updateLineupData()" class="w-full bg-white/90 border-2 border-slovan-blue rounded-lg p-2 text-xs font-bold text-slate-800 shadow">
                            <option value="">-- Vyberte hráče --</option>
                        </select>
                    </div>
                </div>

                <!-- OBRANA (LD, RD) -->
                <div class="flex justify-around items-center z-10 px-8">
                    <div class="text-center w-1/2 px-4">
                        <label class="block text-[10px] font-black uppercase text-slovan-red tracking-wider mb-1">Levý bek (LD)</label>
                        <select id="pos-LD" onchange="updateLineupData()" class="w-full bg-white/90 border-2 border-slovan-red rounded-lg p-2 text-xs font-bold text-slate-800 shadow">
                            <option value="">-- Vyberte hráče --</option>
                        </select>
                    </div>
                    <div class="text-center w-1/2 px-4">
                        <label class="block text-[10px] font-black uppercase text-slovan-red tracking-wider mb-1">Pravý bek (RD)</label>
                        <select id="pos-RD" onchange="updateLineupData()" class="w-full bg-white/90 border-2 border-slovan-red rounded-lg p-2 text-xs font-bold text-slate-800 shadow">
                            <option value="">-- Vyberte hráče --</option>
                        </select>
                    </div>
                </div>

                <!-- GÓLMAN (G) -->
                <div class="flex justify-center items-center z-10">
                    <div class="text-center w-1/3 px-2">
                        <label class="block text-[10px] font-black uppercase text-slate-600 tracking-wider mb-1">Brankář (G)</label>
                        <select id="pos-G" onchange="updateLineupData()" class="w-full bg-white/90 border-2 border-slate-600 rounded-lg p-2 text-xs font-bold text-slate-800 shadow">
                            <option value="">-- Vyberte gólmana --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Akční tlačítka dole -->
            <div class="flex flex-wrap justify-between items-center pt-2 gap-3">
                <button onclick="exportLineupImage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Stáhnout jako obrázek
                </button>
                <div class="flex space-x-2">
                    <button onclick="closeLineupModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 text-sm font-bold">Zavřít</button>
                    <button onclick="saveLineupChanges()" class="px-5 py-2 rounded-xl bg-slovan-red hover:bg-red-700 text-white text-sm font-bold shadow">Uložit sestavu</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Aplikační logika -->
    <script>
        let players = [];
        let matches = [];
        let currentMatchId = null;
        let currentLineupTab = 'lajna1';
        let activeMatchLineups = {};

        function loadData() {
            const savedPlayers = localStorage.getItem('slovan_players');
            const savedMatches = localStorage.getItem('slovan_matches');

            if (!savedPlayers) {
                players = [
                    { id: 1, name: 'Jan Novák', pos: 'Útočník' },
                    { id: 2, name: 'Petr Svoboda', pos: 'Obránce' },
                    { id: 3, name: 'Martin Dvořák', pos: 'Útočník' },
                    { id: 4, name: 'Tomáš Černý', pos: 'Brankář' }
                ];
                localStorage.setItem('slovan_players', JSON.stringify(players));
            } else {
                players = JSON.parse(savedPlayers);
            }

            if (!savedMatches) {
                matches = [
                    {
                        id: 9991,
                        opponent: 'HC Rakovník',
                        date: '2026-08-20T18:00',
                        availablePlayers: [1, 2, 3, 4],
                        lineups: {}
                    }
                ];
                localStorage.setItem('slovan_matches', JSON.stringify(matches));
            } else {
                matches = JSON.parse(savedMatches);
            }

            renderPlayers();
            renderMatches();
        }

        function saveData() {
            localStorage.setItem('slovan_players', JSON.stringify(players));
            localStorage.setItem('slovan_matches', JSON.stringify(matches));
        }

        function switchTab(tabName) {
            document.getElementById('tab-matches').classList.add('hidden');
            document.getElementById('tab-players').classList.add('hidden');
            document.getElementById('tab-match-detail').classList.add('hidden');

            document.getElementById('btn-matches').className = "px-4 py-2 rounded-lg bg-blue-900 text-slate-200 font-medium text-sm transition";
            document.getElementById('btn-players').className = "px-4 py-2 rounded-lg bg-blue-900 text-slate-200 font-medium text-sm transition";

            if (tabName === 'matches') {
                document.getElementById('tab-matches').classList.remove('hidden');
                document.getElementById('btn-matches').className = "px-4 py-2 rounded-lg bg-slovan-red text-white font-medium text-sm transition shadow";
            } else if (tabName === 'players') {
                document.getElementById('tab-players').classList.remove('hidden');
                document.getElementById('btn-players').className = "px-4 py-2 rounded-lg bg-slovan-red text-white font-medium text-sm transition shadow";
            } else if (tabName === 'detail') {
                document.getElementById('tab-match-detail').classList.remove('hidden');
            }
        }

        function renderPlayers() {
            const tbody = document.getElementById('players-table-body');
            tbody.innerHTML = '';
            players.forEach((p, idx) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-slate-500">${idx + 1}</td>
                        <td class="p-3 font-semibold text-slate-800">${p.name}</td>
                        <td class="p-3"><span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-xs font-bold">${p.pos}</span></td>
                        <td class="p-3 text-right">
                            <button onclick="deletePlayer(${p.id})" class="text-red-500 hover:text-red-700 text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function addPlayerPrompt() {
            const name = prompt("Zadejte jméno a příjmení hráče:");
            if (!name) return;
            const pos = prompt("Zadejte post (Útočník / Obránce / Brankář):", "Útočník");
            players.push({ id: Date.now(), name, pos: pos || 'Útočník' });
            saveData();
            renderPlayers();
        }

        function deletePlayer(id) {
            if (confirm("Opravdu chcete hráče smazat?")) {
                players = players.filter(p => p.id !== id);
                saveData();
                renderPlayers();
            }
        }

        function renderMatches() {
            const list = document.getElementById('matches-list');
            list.innerHTML = '';
            if (matches.length === 0) {
                list.innerHTML = `<p class="text-slate-500 text-sm italic">Žádné naplánované zápasy. Klikněte nahoře na „Nový zápas“.</p>`;
                return;
            }
            matches.forEach(m => {
                list.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-bold text-slovan-red uppercase">${new Date(m.date).toLocaleString('cs-CZ')}</span>
                                <span class="bg-blue-100 text-slovan-blue px-2 py-0.5 rounded text-xs font-bold">${m.availablePlayers ? m.availablePlayers.length : 0} hráčů k dispozici</span>
                            </div>
                            <h3 class="text-xl font-bold text-slovan-blue mt-1">HC Slovan Louny vs. ${m.opponent}</h3>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t">
                            <button onclick="openMatchDetail(${m.id})" class="text-slovan-blue font-bold text-sm hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-eye"></i> Detail a sestavy
                            </button>
                            <button onclick="deleteMatch(${m.id})" class="text-slate-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function openNewMatchModal() {
            document.getElementById('match-opponent').value = '';
            document.getElementById('match-date').value = '';
            const container = document.getElementById('match-players-checkboxes');
            container.innerHTML = '';
            if (players.length === 0) {
                container.innerHTML = `<p class="text-xs text-red-500">Nejprve přidejte hráče v záložce Hráči!</p>`;
            }
            players.forEach(p => {
                container.innerHTML += `
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" value="${p.id}" checked class="match-player-cb rounded text-slovan-blue focus:ring-slovan-blue">
                        <span class="text-slate-700">${p.name} (${p.pos})</span>
                    </label>
                `;
            });
            document.getElementById('modal-match').classList.remove('hidden');
        }

        function closeNewMatchModal() {
            document.getElementById('modal-match').classList.add('hidden');
        }

        function saveNewMatch() {
            const opponent = document.getElementById('match-opponent').value.trim();
            const date = document.getElementById('match-date').value;
            if (!opponent || !date) {
                alert("Vyplňte prosím soupeře i datum.");
                return;
            }
            const checkboxes = document.querySelectorAll('.match-player-cb:checked');
            const availablePlayers = Array.from(checkboxes).map(cb => parseInt(cb.value));

            matches.push({
                id: Date.now(),
                opponent,
                date,
                availablePlayers,
                lineups: {}
            });
            saveData();
            closeNewMatchModal();
            renderMatches();
        }

        function deleteMatch(id) {
            if (confirm("Smazat tento zápas?")) {
                matches = matches.filter(m => m.id !== id);
                saveData();
                renderMatches();
            }
        }

        function openMatchDetail(id) {
            currentMatchId = id;
            const match = matches.find(m => m.id === id);
            if (!match) return;

            document.getElementById('detail-match-date').innerText = new Date(match.date).toLocaleString('cs-CZ');
            document.getElementById('detail-match-title').innerText = `HC Slovan Louny vs. ${match.opponent}`;
            document.getElementById('detail-match-info').innerText = `Počet hráčů k dispozici pro zápas: ${match.availablePlayers ? match.availablePlayers.length : 0}`;

            const previewContainer = document.getElementById('saved-lineups-preview');
            previewContainer.innerHTML = '';
            
            const lineupNames = { 'lajna1': '1. Lajna', 'lajna2': '2. Lajna', 'lajna3': '3. Lajna', 'special': 'Speciální formace' };
            let hasLineups = false;

            for (let key in lineupNames) {
                if (match.lineups && match.lineups[key]) {
                    hasLineups = true;
                    let l = match.lineups[key];
                    previewContainer.innerHTML += `
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 shadow-sm">
                            <h4 class="font-bold text-slovan-blue text-sm border-b pb-1">${lineupNames[key]}</h4>
                            <p class="text-xs text-slate-600"><strong>Útok:</strong> ${getPlayerName(l.LW)}, ${getPlayerName(l.C)}, ${getPlayerName(l.RW)}</p>
                            <p class="text-xs text-slate-600"><strong>Obrana:</strong> ${getPlayerName(l.LD)}, ${getPlayerName(l.RD)}</p>
                            <p class="text-xs text-slate-600"><strong>Gólman:</strong> ${getPlayerName(l.G)}</p>
                        </div>
                    `;
                }
            }

            if (!hasLineups) {
                previewContainer.innerHTML = `<p class="text-slate-400 text-sm italic col-span-full">Zatím nebyla vytvořena žádná sestava. Klikněte na „Vytvořit sestavu“.</p>`;
            }

            switchTab('detail');
        }

        function getPlayerName(id) {
            if (!id) return '-';
            const p = players.find(x => x.id == id);
            return p ? p.name : '-';
        }

        function openLineupModal() {
            const match = matches.find(m => m.id === currentMatchId);
            if (!match) return;

            activeMatchLineups = JSON.parse(JSON.stringify(match.lineups || {}));
            populatePlayerSelects(match.availablePlayers || []);
            switchLineupTab('lajna1');
            document.getElementById('modal-lineup').classList.remove('hidden');
        }

        function closeLineupModal() {
            document.getElementById('modal-lineup').classList.add('hidden');
        }

        function populatePlayerSelects(availableIds) {
            const availableList = players.filter(p => availableIds.includes(p.id));

            ['LW', 'C', 'RW', 'LD', 'RD', 'G'].forEach(posCode => {
                const select = document.getElementById(`pos-${posCode}`);
                select.innerHTML = `<option value="">-- Vyberte hráče --</option>`;
                availableList.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${p.name} (${p.pos})</option>`;
                });
            });
        }

        function switchLineupTab(tabKey) {
            updateLineupData();
            currentLineupTab = tabKey;

            ['lajna1', 'lajna2', 'lajna3', 'special'].forEach(k => {
                const btn = document.getElementById(`ltab-${k}`);
                if (k === tabKey) {
                    btn.className = "px-4 py-2 rounded-lg font-bold text-sm bg-slovan-blue text-white shadow";
                } else {
                    btn.className = "px-4 py-2 rounded-lg font-bold text-sm bg-white text-slate-700 hover:bg-slate-200";
                }
            });

            const data = activeMatchLineups[tabKey] || { LW: '', C: '', RW: '', LD: '', RD: '', G: '' };
            ['LW', 'C', 'RW', 'LD', 'RD', 'G'].forEach(posCode => {
                document.getElementById(`pos-${posCode}`).value = data[posCode] || '';
            });
        }

        function updateLineupData() {
            if (!activeMatchLineups[currentLineupTab]) {
                activeMatchLineups[currentLineupTab] = {};
            }
            ['LW', 'C', 'RW', 'LD', 'RD', 'G'].forEach(posCode => {
                activeMatchLineups[currentLineupTab][posCode] = document.getElementById(`pos-${posCode}`).value;
            });
        }

        function saveLineupChanges() {
            updateLineupData();
            const match = matches.find(m => m.id === currentMatchId);
            if (match) {
                match.lineups = JSON.parse(JSON.stringify(activeMatchLineups));
                saveData();
            }
            closeLineupModal();
            openMatchDetail(currentMatchId);
            alert("Sestava byla úspěšně uložena!");
        }

        function exportLineupImage() {
            updateLineupData();
            const rinkElement = document.getElementById('rink-capture-area');
            
            html2canvas(rinkElement, { scale: 2, backgroundColor: '#f8fafc' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `sestava_${currentLineupTab}_hc_slovan.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Spuštění při načtení stránky
        loadData();
    </script>

    <!-- Registrace Service Workeru pro PWA (Android) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker zaregistrován:', reg))
            .catch(err => console.error('Chyba při registraci SW:', err));
        });
      }
    </script>
</body>
