<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC Slovan Louny</title>
    
    <!-- PWA Manifest a nastavení pro mobilní zařízení -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b192c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b192c;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            color: #333;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #0b192c;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #f0f4f8;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-home { background-color: #0056b3; }
        .btn-away { background-color: #28a745; }
        .btn-penalty-home { background-color: #dc3545; }
        .btn-penalty-away { background-color: #d9534f; }
        
        .events-list {
            margin-top: 20px;
            border-top: 2px solid #ccc;
            padding-top: 10px;
        }
        .event-item {
            background: #f9f9f9;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 0.9em;
            border-left: 4px solid #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>HC Slovan Louny vs. Teplice</h2>
        
        <div class="scoreboard">
            <div>DOMÁCÍ: <span id="scoreHome">0</span></div>
            <div>:</div>
            <div>HOSTÉ: <span id="scoreAway">0</span></div>
        </div>

        <div class="btn-group">
            <button class="btn-home" onclick="pridatGol('Louny')">⚽ Gól Louny</button>
            <button class="btn-away" onclick="pridatGol('Teplice')">⚽ Gól Soupeř</button>
            <button class="btn-penalty-home" onclick="pridatFaul('Louny')">🟨 Faul Louny</button>
            <button class="btn-penalty-away" onclick="pridatFaul('Teplice')">🟨 Faul Soupeř</button>
        </div>

        <div class="events-list">
            <h3>Události v utkání</h3>
            <div id="seznamUdalosti">Načítám události...</div>
        </div>
    </div>

    <!-- Firebase a logika aplikace -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Konfigurace pro Firebase projekt hc-slovan-louny
        const firebaseConfig = {
            apiKey: "AIzaSyDCRCC7JZ8fUO0ly5EBrJwIMrvB8eq3MD4",
            authDomain: "hc-slovan-louny.firebaseapp.com",
            databaseURL: "https://hc-slovan-louny-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hc-slovan-louny",
            storageBucket: "hc-slovan-louny.firebasestorage.app",
            messagingSenderId: "1095365058859",
            appId: "1:1095365058859:web:1987c8eac2305f9ccca56e",
            measurementId: "G-7J2DJX4NLJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const analytics = getAnalytics(app);

        // Globální funkce pro zápis událostí do Firebase
        window.pridatGol = function(tym) {
            const cas = new Date().toLocaleTimeString();
            push(ref(db, 'udalosti'), {
                text: `${cas} - Gól: ${tym}`,
                typ: 'gol',
                tym: tym
            });
        };

        window.pridatFaul = function(tym) {
            const cas = new Date().toLocaleTimeString();
            push(ref(db, 'udalosti'), {
                text: `${cas} - Faul: ${tym}`,
                typ: 'faul',
                tym: tym
            });
        };

        // Naslouchání změnám v databázi v reálném čase
        const udalostiRef = ref(db, 'udalosti');
        onValue(udalostiRef, (snapshot) => {
            const data = snapshot.val();
            const seznamDiv = document.getElementById('seznamUdalosti');
            seznamDiv.innerHTML = '';

            let skoreLouny = 0;
            let skoreTeplice = 0;

            if (data) {
                Object.values(data).forEach(udalost => {
                    // Výpočet skóre podle typu události
                    if (udalost.typ === 'gol') {
                        if (udalost.tym === 'Louny') skoreLouny++;
                        if (udalost.tym === 'Teplice') skoreTeplice++;
                    }

                    // Vykreslení položky (čistý text bez chybného kódování)
                    const item = document.createElement('div');
                    item.className = 'event-item';
                    item.textContent = udalost.text;
                    seznamDiv.prepend(item); // Nejnovější nahoře
                });
            } else {
                seznamDiv.innerHTML = 'Zatím žádné události.';
            }

            document.getElementById('scoreHome').textContent = skoreLouny;
            document.getElementById('scoreAway').textContent = skoreTeplice;
        });
    </script>

    <!-- Registrace Service Workera pro instalaci jako PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrován:', reg.scope))
                    .catch((err) => console.log('Chyba registrace SW:', err));
            });
        }
    </script>
</body>
</html>
